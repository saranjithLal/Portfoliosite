<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saranjith Lal — Portfolio</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #fff;
      overflow-x: hidden;
    }

    .behance-wrapper {
      width: 100%;
      min-height: 100vh;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100vh;
      min-height: 100vh;
      border: 0;
    }
  </style>
</head>

<body>

  <div class="behance-wrapper">
    <iframe
      src="https://www.behance.net/embed/project/252725563?ilo0=1"
      allowfullscreen
      loading="lazy"
      allow="clipboard-write"
      referrerpolicy="strict-origin-when-cross-origin">
    </iframe>
  </div>

</body>
</html>
